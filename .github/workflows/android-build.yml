name: Build Play-Ready Android Release

on:
  push:
    branches: [ "main", "v1.4-test", "v1.5-test", "v1.6-test" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare stable signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$RELEASE_KEYSTORE_PASSWORD" || { echo "::error::Missing RELEASE_KEYSTORE_PASSWORD secret"; exit 1; }
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hisabikhata-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/hisabikhata-release.jks" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias familykhata >/dev/null

      - name: Build signed APK and App Bundle
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/hisabikhata-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          EXPECTED_CERT_SHA256="a2eaefe393888974b8a95aa6355bf029ba3b8ca11665d8b432328f4248cfc1e1"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

          ACTUAL_CERT_SHA256="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}')"

          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256" || {
            echo "::error::APK certificate fingerprint does not match the Hisabi Khata stable signing key"
            exit 1
          }

      - name: Verify App Bundle signature
        run: |
          set -euo pipefail
          export LC_ALL=C
          AAB="app/build/outputs/bundle/release/app-release.aab"
          EXPECTED_CERT_SHA256="a2eaefe393888974b8a95aa6355bf029ba3b8ca11665d8b432328f4248cfc1e1"

          test -s "$AAB"
          jarsigner -verify "$AAB"

          ACTUAL_AAB_CERT_SHA256="$(keytool -printcert -jarfile "$AAB" \
            | awk -F': ' '/SHA256:/ {gsub(":", "", $2); print tolower($2); exit}')"

          test "$ACTUAL_AAB_CERT_SHA256" = "$EXPECTED_CERT_SHA256" || {
            echo "::error::AAB certificate fingerprint does not match the Hisabi Khata stable signing key"
            exit 1
          }

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: HisabiKhata-v1.5-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload direct-install APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabiKhata-v1.5-direct-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
